name: Build HUNTERICE ABYSS VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build VST3
      run: cmake --build build --config Release --target HUNTERICE_ABYSS_VST3

    - name: Package Artifact
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifact
        Copy-Item -Path "build/HUNTERICE_ABYSS_artefacts/Release/VST3/HUNTERICE_ABYSS.vst3" -Destination "artifact/" -Recurse
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HUNTERICE-ABYSS-VST3-Windows
        path: artifact/
